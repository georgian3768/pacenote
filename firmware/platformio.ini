[env:stable]
platform = espressif32@6.6.0
framework = arduino
board = esp32dev

board_build.partitions = huge_app.csv

; Slow down upload speed for reliable flash writing
upload_speed = 115200
monitor_speed = 1000000

lib_deps =
    https://github.com/collin80/can_common.git
    https://github.com/collin80/esp32_can.git
    https://github.com/collin80/esp32_mcp2517fd.git
    ; Pinned exactly: the 3.10 line added a FastLED ClearFlags::BRIGHTNESS
    ; enumerator that collides with the firmware's own LED brightness macro.
    ; The firmware now calls it LED_BRIGHTNESS, and the version is pinned so a
    ; fresh clone builds the same image the release was built from.
    fastled/FastLED@3.10.3
; Async HTTP server for the /events SSE stream. Pinned: the 3.x line of the
; ESP32Async fork documents Arduino core 2.x support, which the espressif32@6.6.0
; platform requires (core 3.0 removed the RMT drivers FastLED needs).
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1

build_flags = -DCORE_DEBUG_LEVEL=5
