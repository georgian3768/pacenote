<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacenote</title>
<style>
  :root {
    /* Three near-blacks and nothing else: page < raised < card. Any fourth
       dark would read as a different surface for no reason. */
    color-scheme: dark;
    --page: #0a0c10; --raise: #0c0e12; --card: #151a22;
    --border: #2c3442; --ink: #e9edf5; --dim: #8892a6; --faint: #5e6878;
    --green: #2ec27e; --amber: #f5a524; --red: #e5484d;
  }
  /* Light is not an inversion: the cue colours are darkened until they clear
     4.5:1 on white. DashboardActivity pushes this with window.pm.theme(). */
  html[data-theme="light"] {
    color-scheme: light;
    --page: #f2f4f7; --raise: #ffffff; --card: #ffffff;
    --border: #d6dce6; --ink: #131820; --dim: #4c5868; --faint: #66717f;
    --green: #0e7a4a; --amber: #b45309; --red: #c62828;
  }
  * { box-sizing: border-box; }
  html { margin: 0; height: 100%; overflow: hidden; background: var(--page); }
  /* Fixed positioning, not just height:100%: with the flex children below the
     page still grew past the viewport and showed a scrollbar (2026-10-30). */
  body { position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
    background: var(--page);
    color: var(--ink); font-family: system-ui, -apple-system, "Roboto", sans-serif;
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 14px 12px;
    -webkit-tap-highlight-color: transparent;
  }

  header { flex: none; padding: 2px 2px 0; }
  h1 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -0.4px; }
  #subtitle { margin: 4px 0 0; color: var(--dim); font-size: 12px; line-height: 1.25; }

  /* The menu is the only scrolling part: the telemetry panel is a native view
     pinned below this WebView, not part of the page. */
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 8px; padding: 2px 0 4px;
    scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }

  .menu-card { background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; flex: none; }
  .menu-row { display: flex; align-items: center; width: 100%; min-height: 64px;
    padding: 12px 14px; border: 0; border-bottom: 1px solid var(--border);
    background: transparent; color: var(--ink); font: inherit; text-align: left; }
  .menu-row:last-child { border-bottom: 0; }
  .menu-row:active { background: rgba(46, 194, 126, .12); }
  .menu-text { flex: 1 1 auto; min-width: 0; }
  .menu-title { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; }
  .menu-desc { display: block; margin-top: 2px; color: var(--dim);
    font-size: 11px; line-height: 1.3; }
  .chev { flex: none; padding-left: 10px; color: var(--green); font-size: 22px;
    line-height: 1; }
  .menu-row.demoted .menu-title { color: var(--dim); font-weight: 400; font-size: 15px; }
  .menu-row.demoted .menu-desc { color: var(--faint); font-size: 10.5px; }
  .menu-row.demoted .chev { color: var(--faint); font-size: 18px; }
  .menu-row.on .menu-title { color: var(--green); }

  .last-trip { display: none; width: 100%; padding: 10px 14px; text-align: left;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    color: var(--ink); font: inherit; flex: none; }
  .last-trip:active { background: rgba(46, 194, 126, .10); }
  .last-trip .label { display: block; color: var(--faint); font-size: 9px;
    letter-spacing: .14em; }
  #lasttrip-main { display: block; margin-top: 3px; font-size: 13px; font-weight: 600; }
  #lasttrip-sub { display: block; margin-top: 1px; color: var(--dim); font-size: 10.5px; }
</style>
</head>
<body>
  <header>
    <h1>Pacenote</h1>
    <p id="subtitle">Trips, calibration and settings.</p>
  </header>

  <main id="menu">
    <div class="menu-card">
      <button class="menu-row" onclick="openTrips()">
        <span class="menu-text">
          <span class="menu-title">Trip history</span>
          <span class="menu-desc" id="tripdesc">No drives yet · tap for details</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row" onclick="openCalibration()">
        <span class="menu-text">
          <span class="menu-title">Sensor calibration</span>
          <span class="menu-desc">throttle range · gear ratios · GPS scale</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row" onclick="openVehicle()">
        <span class="menu-text">
          <span class="menu-title">Vehicle &amp; driver</span>
          <span class="menu-desc">profile · units · stream permissions</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row" id="overlay-row" onclick="cycleOverlay()">
        <span class="menu-text">
          <span class="menu-title">Floating overlay</span>
          <span class="menu-desc" id="overlay-desc">Auto · over other apps while driving</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row" id="keepon-row" onclick="toggleKeepScreenOn()">
        <span class="menu-text">
          <span class="menu-title">Keep screen on</span>
          <span class="menu-desc" id="keepon-desc">On · the panel keeps the display awake</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row" id="nav-row" onclick="openNavAccess()">
        <span class="menu-text">
          <span class="menu-title">Navigation HUD</span>
          <span class="menu-desc" id="nav-desc">Needs notification access · tap to grant</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row" id="wifi-row" onclick="saveWifi()">
        <span class="menu-text">
          <span class="menu-title">ESP32 Wi-Fi</span>
          <span class="menu-desc" id="wifi-desc">Not saved · tap to save</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row demoted" onclick="openDiagnostics()">
        <span class="menu-text">
          <span class="menu-title">Diagnostics</span>
          <span class="menu-desc">link state · event log · stream proof</span>
        </span>
        <span class="chev">›</span>
      </button>
    </div>

    <button class="last-trip" id="lasttrip" onclick="openTrips()">
      <span class="label">LAST TRIP</span>
      <span id="lasttrip-main"></span>
      <span id="lasttrip-sub"></span>
    </button>
  </main>

<script>
  // Contract with DashboardActivity: window.pm.{config,lastTrip}.
  //
  // This page is the menu only. Telemetry is the native panel below it, so
  // there is deliberately no frame/link/cue hook here: one number must not have
  // two renderers that can disagree.
  const $ = id => document.getElementById(id);
  const isNil = v => v === null || v === undefined;

  /** Calls a Kotlin bridge method, or fails quietly in a plain browser. */
  function bridge(name) {
    try { return Android[name](); } catch (e) { return null; }
  }

  function openTrips() { bridge('openTrips'); }
  function openCalibration() { bridge('openCalibration'); }
  function openVehicle() { bridge('openVehicle'); }
  function openDiagnostics() { bridge('openDiagnostics'); }

  // Three states, one tap order: auto -> always -> off -> auto. "on" only
  // colours the row; the description is the truth, because "always" and
  // "auto" both put the bubble on screen.
  function paintOverlay(mode, desc) {
    if (mode !== undefined) {
      $('overlay-row').classList.toggle('on', mode !== 'off');
      $('overlay-row').dataset.mode = mode;
    }
    if (desc) $('overlay-desc').textContent = desc;
  }

  function cycleOverlay() {
    const raw = bridge('cycleOverlay');
    if (!raw) return;
    try {
      const state = JSON.parse(raw);
      paintOverlay(state.mode, state.desc);
    } catch (e) { /* leave the row as-is */ }
  }

  function paintKeepOn(on, desc) {
    if (on !== undefined) $('keepon-row').classList.toggle('on', !!on);
    if (desc) $('keepon-desc').textContent = desc;
  }

  function toggleKeepScreenOn() {
    const raw = bridge('toggleKeepScreenOn');
    if (!raw) return;
    try {
      const state = JSON.parse(raw);
      paintKeepOn(state.on, state.desc);
    } catch (e) { /* leave the row as-is */ }
  }

  function paintWifi(desc) {
    if (desc) $('wifi-desc').textContent = desc;
  }

  function saveWifi() { bridge('saveWifi'); }

  // The HUD is a layout, not a setting: notification access either exists and
  // Maps/Waze drive the switch, or it does not. The row's job is the grant.
  function paintNav(on, desc) {
    if (on !== undefined) $('nav-row').classList.toggle('on', !!on);
    if (desc) $('nav-desc').textContent = desc;
  }

  function openNavAccess() { bridge('openNavAccess'); }

  window.pm = {
    // Pushed by DashboardActivity before every config: the page follows the
    // system theme, it does not have a switch of its own.
    theme(mode) {
      document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark';
    },

    config(c) {
      paintOverlay(c.overlayMode, c.overlayDesc);
      paintKeepOn(c.keepScreenOn, c.keepScreenDesc);
      paintNav(c.navOn, c.navDesc);
      paintWifi(c.wifiDesc);
    },

    /**
     * Last completed trip, from Room, pushed on resume and when a trip ends.
     * The strip is hidden until there is a real row to show.
     */
    lastTrip(t) {
      const row = $('lasttrip');
      if (!t) {
        row.style.display = 'none';
        $('tripdesc').textContent = 'No drives yet · tap for details';
        return;
      }
      row.style.display = 'block';
      const eco = isNil(t.ecoScore) ? '' : ' · eco ' + t.ecoScore;
      $('lasttrip-main').textContent = '#' + t.id + ' · '
          + Number(t.distanceKm || 0).toFixed(2) + ' km' + eco;
      $('lasttrip-sub').textContent = (t.startedLabel || '')
          + ' · tap for all ' + t.count + (t.count === 1 ? ' drive' : ' drives');
      $('tripdesc').textContent = t.count + (t.count === 1 ? ' drive' : ' drives')
          + ' · tap for CSV';
    }
  };
</script>
</body>
</html>
